[project]
name = "fieldsure-ai"
version = "0.1.0"
description = "FieldSure AI — Retrieval-Augmented Generation (RAG) assistant for public health field workers"
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kalvium Community & FieldSure AI Team" }
]
keywords = ["rag", "public-health", "llm", "document-processing", "citations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Healthcare Industry",
]

dependencies = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
